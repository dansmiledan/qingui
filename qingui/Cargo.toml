[package]
name = "qingui"
version = "0.1.0"
edition = "2021"
description = "A lightweight embedded GUI library (LVGL-inspired subset): PFB rendering, dirty rects, animation, keypad input"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dansmiledan/qingui"
keywords = ["gui", "embedded", "no_std", "lvgl", "framebuffer"]
categories = ["embedded", "graphics", "no-std"]
readme = "README.md"
# examples/ holds non-executable modules (sim/, images.rs); declare runnable examples explicitly
autoexamples = false
# benches/ holds a single explicitly-declared memory bench (harness = false -> custom main)
autobenches = false

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "gallery"
path = "examples/gallery.rs"

[[bench]]
name = "memory"
path = "benches/memory.rs"
harness = false

[dependencies]
bitflags = { version = "2.13.1", default-features = false }
embedded-graphics = { version = "0.8", default-features = false }

[dev-dependencies]
minifb = "0.28"
