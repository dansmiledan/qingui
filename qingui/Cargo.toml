[package]
name = "qingui"
version = "0.1.0"
edition = "2021"
description = "A lightweight embedded GUI library (LVGL-inspired subset): PFB rendering, dirty rects, animation, keypad input"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dansmiledan/qingui"
keywords = ["gui", "embedded", "no_std", "lvgl", "framebuffer"]
categories = ["embedded", "graphics", "no-std"]
readme = "README.md"
# examples/ 下有非可执行的模块文件（sim/、images.rs），显式声明可执行 example
autoexamples = false

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "gallery"
path = "examples/gallery.rs"

[dependencies]
bitflags = { version = "2.13.1", default-features = false }
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }

[dev-dependencies]
minifb = "0.28"
